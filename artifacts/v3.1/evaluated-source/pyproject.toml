[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataops-copilot-c"
version = "0.3.1"
description = "Candidate C: bounded evidence-grounded LangGraph diagnostic vertical slice"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.11,<3",
    "langgraph>=1,<2",
    "fastmcp>=2.12,<3",
    "mcp>=1.15,<2",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.28,<1",
    "qdrant-client>=1.14,<2",
    "rank-bm25>=0.2,<0.3",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.21,<1",
    "huggingface-hub>=0.30,<2",
    "streamlit>=1.45,<2",
]

[dependency-groups]
dev = [
    "playwright>=1.50,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
]

[project.scripts]
dataops-copilot = "dataops_copilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dataops_copilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
